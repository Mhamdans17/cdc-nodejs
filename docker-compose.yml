version: '3.8'
services:
  mysql:
    image: mysql:8.0
    container_name: cdc_mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: demo_db
    volumes:
      - ./mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-prootpass"]
      interval: 5s
      timeout: 10s
      retries: 10

  redis:
    image: redis:7
    container_name: cdc_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  cdc:
    build: ./cdc-service
    container_name: cdc_service
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      MYSQL_HOST: mysql
      MYSQL_USER: cdc_user
      MYSQL_PASSWORD: cdc_pass
      MYSQL_DB: demo_db
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:
